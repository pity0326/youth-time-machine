<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>青春時光機｜找回你的無名小站</title>

<style>
<script>
async function goBack() {
  const username =
    document.getElementById("username").value.trim();

  if (!username) {
    alert("請先輸入你的無名帳號");
    return;
  }

  const type =
    document.querySelector(
      'input[name="type"]:checked'
    ).value;

  const oldUrl =
    "http://www.wretch.cc/" +
    type +
    "/" +
    encodeURIComponent(username);

  let result = document.getElementById("result");

  if (!result) {
    result = document.createElement("div");
    result.id = "result";
    result.style.marginTop = "25px";
    result.style.lineHeight = "1.8";
    document.querySelector(".card").appendChild(result);
  }

  result.innerHTML = "🔎 正在尋找你的青春紀錄...";

  const api =
    "https://web.archive.org/cdx/search/cdx" +
    "?url=" + encodeURIComponent(oldUrl) +
    "&output=json" +
    "&filter=statuscode:200" +
    "&fl=timestamp" +
    "&collapse=digest";

  try {
    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("查詢失敗");
    }

    const data = await response.json();

    if (!data || data.length <= 1) {
      result.innerHTML =
        "🥲 目前沒有找到公開保存的歷史紀錄。";
      return;
    }

    const years = [];

    for (let i = 1; i < data.length; i++) {
      const timestamp = data[i][0];
      const year = timestamp.substring(0, 4);

      if (!years.includes(year)) {
        years.push(year);
      }
    }

    years.sort();

    let html =
      "<h3>🎉 找到你的青春了！</h3>" +
      "<div>找到 " +
      years.length +
      " 個年份的紀錄：</div><br>";

    years.forEach(year => {
      const link =
        "https://web.archive.org/web/" +
        year +
        "/" +
        oldUrl;

      html +=
        '<a href="' +
        link +
        '" target="_blank" ' +
        'style="display:inline-block;' +
        'margin:5px;padding:9px 12px;' +
        'border:1px solid #ddd;' +
        'border-radius:10px;' +
        'text-decoration:none;color:#222;">' +
        year +
        "</a>";
    });

    const firstYear = years[0];
    const currentYear = new Date().getFullYear();
    const age = currentYear - Number(firstYear);

    html +=
      "<br><br><strong>最早紀錄：" +
      firstYear +
      " 年</strong>";

    html +=
      "<div style='margin-top:8px;color:#666;'>" +
      "你的無名青春距今大約 " +
      age +
      " 年 😆</div>";

    result.innerHTML = html;

  } catch (error) {
    result.innerHTML =
      "⚠️ 暫時無法讀取 Internet Archive，請稍後再試。";
  }
}

document
  .getElementById("username")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      goBack();
    }
  });
</script>
</style>
</head>

<body>

<div class="card">

  <h1>🕰️ 青春時光機</h1>

  <div class="subtitle">
    找回那些年，留在網路上的青春。<br>
    還記得你的無名小站帳號嗎？
  </div>

  <input
    id="username"
    type="text"
    placeholder="輸入你的無名帳號"
    autocomplete="off"
  >

  <div class="label">
    你想回去哪裡？
  </div>

  <div class="choices">

    <label class="choice">
      <input type="radio" name="type" value="album" checked>
      <span>📷<br>相簿</span>
    </label>

    <label class="choice">
      <input type="radio" name="type" value="blog">
      <span>📝<br>網誌</span>
    </label>

    <label class="choice">
      <input type="radio" name="type" value="guestbook">
      <span>💬<br>留言板</span>
    </label>

  </div>

  <button onclick="goBack()">
    🔎 尋找我的青春
  </button>

  <div class="note">
    將透過 Internet Archive 尋找公開保存的歷史網頁。<br>
    實際可查看內容取決於當年是否曾被保存。
  </div>

</div>

<script>

function goBack() {

  const username =
    document.getElementById("username").value.trim();

  if (!username) {
    alert("請先輸入你的無名帳號");
    return;
  }

  const type =
    document.querySelector(
      'input[name="type"]:checked'
    ).value;

  const oldUrl =
    "http://www.wretch.cc/" +
    type +
    "/" +
    encodeURIComponent(username);

  const wayback =
    "https://web.archive.org/web/*/" +
    oldUrl;

  window.open(wayback, "_blank");
}

document
  .getElementById("username")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      goBack();
    }

  });

</script>

</body>
</html>
