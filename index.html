<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>青春時光機｜找回你的無名小站</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #fff8f0, #eef6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: #fff;
      padding: 38px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    .subtitle {
      color: #666;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .username {
      width: 100%;
      padding: 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
    }

    .username:focus {
      border-color: #333;
    }

    .label {
      margin: 22px 0 12px;
      font-weight: bold;
      font-size: 16px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .choice input {
      display: none;
    }

    .choice span {
      display: block;
      padding: 15px 5px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.7;
      transition: .2s;
    }

    .choice input:checked + span {
      border-color: #222;
      background: #222;
      color: white;
    }

    .search-button {
      width: 100%;
      margin-top: 22px;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-button:hover {
      opacity: .88;
    }

    .tip {
      margin-top: 24px;
      padding: 16px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 14px;
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    .privacy {
      margin-top: 20px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 420px) {

      .card {
        padding: 32px 18px;
      }

      h1 {
        font-size: 29px;
      }

      .choice span {
        font-size: 14px;
        padding: 13px 3px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🕰️ 青春時光機</h1>

    <div class="subtitle">
      找回那些年，留在網路上的青春。<br>
      還記得你的無名小站帳號嗎？
    </div>

    <input
      id="username"
      class="username"
      type="text"
      placeholder="輸入你的無名帳號"
      autocomplete="off"
    >

    <div class="label">
      你想回去哪裡？
    </div>

    <div class="choices">

      <label class="choice">
        <input
          type="radio"
          name="type"
          value="album"
          checked
        >
        <span>
          📷<br>
          相簿
        </span>
      </label>

      <label class="choice">
        <input
          type="radio"
          name="type"
          value="blog"
        >
        <span>
          📝<br>
          網誌
        </span>
      </label>

      <label class="choice">
        <input
          type="radio"
          name="type"
          value="guestbook"
        >
        <span>
          💬<br>
          留言板
        </span>
      </label>

    </div>

    <button
      class="search-button"
      onclick="goWayback()"
    >
      🔎 尋找我的青春
    </button>

    <div class="tip">
      💡 <strong>進入時光機後</strong><br>
      選擇上方有紀錄的年份與日期，<br>
      就能看看當年的無名小站。
    </div>

    <div class="privacy">
      本站不會要求或保存你的無名密碼。<br>
      歷史資料來自 Internet Archive 公開保存的網頁紀錄。
    </div>

  </div>


  <script>

    function goWayback() {

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      if (!username) {

        alert("請先輸入你的無名帳號");

        return;
      }


      const type =
        document.querySelector(
          'input[name="type"]:checked'
        ).value;


      const oldUrl =
        "http://www.wretch.cc/" +
        type +
        "/" +
        encodeURIComponent(username);


      const waybackUrl =
        "https://web.archive.org/web/*/" +
        oldUrl;


      window.location.href =
        waybackUrl;

    }


    document
      .getElementById("username")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            goWayback();
          }

        }
      );

  </script>

</body>
</html>
