<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青春時光機｜找回你的無名小站</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff8f0,#eef6ff);display:flex;justify-content:center;padding:28px 18px;color:#222}
.card{width:100%;max-width:680px;background:#fff;border-radius:26px;padding:36px 24px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center;height:max-content}
h1{margin:0 0 8px;font-size:34px}.sub{color:#666;line-height:1.8;margin-bottom:24px}
input[type=text]{width:100%;padding:16px;border:2px solid #ddd;border-radius:13px;font-size:17px;outline:none}input:focus{border-color:#333}
.label{font-weight:bold;margin:22px 0 11px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice input{display:none}.choice span{display:block;padding:14px 5px;border:2px solid #e6e6e6;border-radius:12px;cursor:pointer;line-height:1.7}.choice input:checked+span{background:#222;color:#fff;border-color:#222}
.years{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.year{padding:12px 4px;border:2px solid #e6e6e6;border-radius:11px;background:#fff;cursor:pointer;font-weight:bold}.year.active{background:#222;color:#fff;border-color:#222}
.older-toggle{margin-top:12px;border:0;background:transparent;text-decoration:underline;color:#666;cursor:pointer;font-size:14px}.older{display:none;margin-top:12px;grid-template-columns:repeat(6,1fr);gap:7px}.older.show{display:grid}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.search,.stop{padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}.search{background:#222;color:#fff}.stop{background:#f0f0f0}.stop:disabled,.search:disabled{opacity:.5;cursor:not-allowed}
#result{margin-top:24px}.box{text-align:left;background:#fafafa;border:1px solid #eee;border-radius:16px;padding:19px;line-height:1.7}.month{font-weight:bold;font-size:18px;margin:18px 0 7px}.day{display:inline-block;margin:4px;padding:8px 10px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;text-decoration:none}.small{color:#777;font-size:13px;margin-top:9px}.fallback{display:inline-block;margin-top:12px;padding:10px 13px;background:#222;color:#fff;border-radius:9px;text-decoration:none}.badge{font-size:12px;background:#eee;border-radius:999px;padding:2px 7px;margin-left:6px;color:#555}.foot{margin-top:24px;color:#aaa;font-size:12px;line-height:1.7}
@media(max-width:520px){.years{grid-template-columns:repeat(5,1fr)}.older{grid-template-columns:repeat(3,1fr)}.actions{grid-template-columns:1fr}.card{padding:30px 17px}h1{font-size:29px}}
</style></head>
<body><main class="card">
<h1>🕰️ 青春時光機</h1>
<div class="sub">找回那些年，留在網路上的青春。<br>還記得你的無名小站帳號嗎？</div>
<input id="username" type="text" placeholder="輸入你的無名帳號" autocomplete="off">

<div class="label">你想回去哪裡？</div>
<div class="choices">
<label class="choice"><input type="radio" name="type" value="album" checked><span>📷<br>相簿</span></label>
<label class="choice"><input type="radio" name="type" value="blog"><span>📝<br>網誌</span></label>
<label class="choice"><input type="radio" name="type" value="guestbook"><span>💬<br>留言板</span></label>
</div>

<div class="label">你想回到哪一年？</div>
<div class="years" id="mainYears"></div>
<button class="older-toggle" onclick="toggleOlder()">🕰️ 找更早的青春</button>
<div class="older" id="olderYears"></div>

<div class="actions">
<button id="searchBtn" class="search" onclick="searchYear()">🔎 尋找這一年的青春</button>
<button id="stopBtn" class="stop" onclick="stopSearch()" disabled>✕ 中止搜尋</button>
</div>
<div id="result"></div>
<div class="foot">本站不會要求或保存你的無名密碼。<br>歷史資料來自 Internet Archive 公開保存的網頁紀錄。</div>
</main>
<script>
let selectedYear="2013",activeController=null,timerId=null,startedAt=0;
function makeYearButton(y,container){const b=document.createElement("button");b.type="button";b.className="year"+(String(y)===selectedYear?" active":"");b.textContent=y;b.onclick=()=>{selectedYear=String(y);document.querySelectorAll(".year").forEach(x=>x.classList.remove("active"));b.classList.add("active")};container.appendChild(b)}
const main=document.getElementById("mainYears");[2009,2010,2011,2012,2013].forEach(y=>makeYearButton(y,main));
const older=document.getElementById("olderYears");[2003,2004,2005,2006,2007,2008].forEach(y=>makeYearButton(y,older));
function toggleOlder(){older.classList.toggle("show")}
function stopSearch(){if(activeController)activeController.abort()}
function timer(on){clearInterval(timerId);if(!on)return;startedAt=Date.now();timerId=setInterval(()=>{const e=document.getElementById("elapsed");if(e)e.textContent=((Date.now()-startedAt)/1000).toFixed(1)},100)}
function key(u,t,y){return`ytm:${u}:${t}:${y}`}
function calendar(u,t){return`https://web.archive.org/web/*/http://www.wretch.cc/${t}/${encodeURIComponent(u)}`}
function render(d,cache=false){const r=document.getElementById("result");if(!d.found){r.innerHTML=`<div class="box">🥲 ${selectedYear} 年暫時沒有取得紀錄。<div class="small">這不一定代表當年完全沒有資料。</div></div>`;return}
let h=`<div class="box"><strong>🎉 找到 ${selectedYear} 年的青春了！</strong>${cache?'<span class="badge">快取</span>':''}<div class="small">共找到 ${d.days.length} 個有保存紀錄的日期</div>`;
for(const m of Object.keys(d.months).sort()){h+=`<div class="month">${Number(m)} 月</div>`;for(const x of d.months[m])h+=`<a class="day" target="_blank" rel="noopener" href="${x.url}">${Number(x.day)} 日</a>`}
h+=`<div class="small">點日期即可回到當天保存的無名頁面。</div></div>`;r.innerHTML=h}
async function searchYear(){
const u=document.getElementById("username").value.trim(),t=document.querySelector('input[name=type]:checked').value,r=document.getElementById("result"),sb=document.getElementById("searchBtn"),xb=document.getElementById("stopBtn");
if(!u){alert("請先輸入無名帳號");return}if(!/^[A-Za-z0-9._-]{1,80}$/.test(u)){alert("帳號格式不正確");return}
const k=key(u,t,selectedYear);try{const c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.savedAt<604800000){render(c.data,true);return}}catch{}
activeController=new AbortController();sb.disabled=true;xb.disabled=false;r.innerHTML=`<div class="box">⏳ 正在尋找 ${selectedYear} 年的青春紀錄…<div class="small">已搜尋 <strong id="elapsed">0.0</strong> 秒，可隨時中止。</div><a class="fallback" target="_blank" rel="noopener" href="${calendar(u,t)}">直接前往 Wayback</a></div>`;timer(true);
try{const res=await fetch(`/api/year-fast?username=${encodeURIComponent(u)}&type=${t}&year=${selectedYear}`,{signal:activeController.signal});const d=await res.json();if(!res.ok)throw new Error(d.error||"查詢失敗");try{localStorage.setItem(k,JSON.stringify({savedAt:Date.now(),data:d}))}catch{}render(d)}
catch(e){r.innerHTML=e.name==="AbortError"?`<div class="box">⛔ 已中止搜尋。<div class="small">可以換年份、稍後再試，或直接進 Wayback。</div><a class="fallback" target="_blank" rel="noopener" href="${calendar(u,t)}">直接前往 Wayback</a></div>`:`<div class="box">⚠️ Internet Archive 回應較慢或查詢失敗。<div class="small">${e.message}</div><a class="fallback" target="_blank" rel="noopener" href="${calendar(u,t)}">直接前往 Wayback</a></div>`}
finally{timer(false);activeController=null;sb.disabled=false;xb.disabled=true}}
document.getElementById("username").addEventListener("keydown",e=>{if(e.key==="Enter")searchYear()});
</script></body></html>
