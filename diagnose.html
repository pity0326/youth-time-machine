<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青春時光機｜搜尋診斷</title>
<style>
body{font-family:"Microsoft JhengHei",sans-serif;background:#11110f;color:#eee1c3;margin:0;padding:24px}
.box{max-width:900px;margin:auto;background:#efe2c4;color:#30291f;padding:22px;border-radius:8px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
input,select,button{padding:11px;box-sizing:border-box}
button{background:#536a3d;color:white;border:0;border-radius:5px;font-weight:bold;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;background:#191815;color:#eee1c3;padding:14px;border-radius:6px;max-height:65vh;overflow:auto}
.small{font-size:13px;color:#6d6250;line-height:1.7}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box">
<h2>🔎 青春時光機搜尋診斷</h2>
<p class="small">這頁只用來查「為什麼 Wayback 明明有，但青春時光機抓不到」。不會寫入人工資料，也不會修改快取。</p>
<div class="row">
<input id="username" value="baby217" placeholder="無名帳號">
<select id="type">
<option value="album">相簿</option>
<option value="blog">網誌</option>
<option value="guestbook">留言板</option>
</select>
<input id="year" value="2011" inputmode="numeric">
<button onclick="run()">開始診斷</button>
</div>
<div id="summary" class="small" style="margin-top:14px"></div>
<pre id="out">尚未執行。</pre>
</div>
<script>
async function run(){
  const u=document.getElementById("username").value.trim();
  const t=document.getElementById("type").value;
  const y=document.getElementById("year").value.trim();
  const out=document.getElementById("out");
  const summary=document.getElementById("summary");
  out.textContent="診斷中…";
  summary.textContent="";
  try{
    const r=await fetch(`/api/diagnose?username=${encodeURIComponent(u)}&type=${encodeURIComponent(t)}&year=${encodeURIComponent(y)}`,{cache:"no-store"});
    const d=await r.json();
    if(d.summary){
      summary.innerHTML=`Calendar 成功：<b>${d.summary.calendarOk}</b> ／ CDX 成功：<b>${d.summary.cdxOk}</b> ／ Availability 成功：<b>${d.summary.availabilityOk}</b> ／ HTTP 狀態：<b>${(d.summary.statuses||[]).join(", ")||"無"}</b>`;
    }
    out.textContent=JSON.stringify(d,null,2);
  }catch(e){
    out.textContent="診斷失敗："+e;
  }
}
</script>
</body>
</html>
