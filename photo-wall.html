<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青春照片牆</title><style>
*{box-sizing:border-box}body{margin:0;background:#11110f;color:#eee1c3;font-family:"Microsoft JhengHei",sans-serif;padding:24px 14px 40px}.wrap{width:min(980px,100%);margin:auto}header{padding:18px 4px 22px;border-bottom:1px dashed #8e7545;margin-bottom:22px}h1{margin:0 0 8px;font-family:"DFKai-SB","Microsoft JhengHei",serif;letter-spacing:4px}.sub{color:#c7b995;line-height:1.7}.status{margin:16px 0 22px;padding:14px 16px;border:1px dashed #8e7545;background:#181814;color:#d9c595}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.photo{display:block;background:#eee1c4;padding:8px 8px 25px;color:#4b4335;text-decoration:none;box-shadow:5px 7px 0 rgba(0,0,0,.2);transform:rotate(var(--r))}.photo img{width:100%;aspect-ratio:4/3;display:block;object-fit:cover;background:#d8ccb2}.caption{text-align:center;font:12px Georgia,serif;margin-top:8px}.note{margin-top:28px;font-size:13px;color:#a99b7c;line-height:1.7}@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:460px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}h1{font-size:26px}}</style></head><body><div class="wrap">
<header><h1>📷 青春照片牆</h1><div class="sub">先把還留在 Wayback 裡的小張照片救回來。<br>點照片可以開啟，手機可長按儲存。</div></header>
<div id="status" class="status">⏳ 正在整理這本相簿的青春照片…</div><div id="grid" class="grid"></div>
<div class="note">※ 目前救回的是當年保存下來的縮圖，因此畫質較小；有保存才會出現在照片牆。</div></div>
<script>(async()=>{const s=document.getElementById("status"),g=document.getElementById("grid");try{const r=await fetch("/api/photo-wall",{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw 0;s.innerHTML=`🎉 <strong>${d.album}</strong>：找到 <strong>${d.recoveredCount}</strong> / ${d.total} 張可救回的小照片`;d.photos.forEach((p,i)=>{const a=document.createElement("a");a.className="photo";a.href=p.proxyUrl;a.target="_blank";a.rel="noopener";a.style.setProperty("--r",((i%5)-2)*.55+"deg");a.innerHTML=`<img loading="lazy" src="${p.proxyUrl}" alt="青春照片 ${i+1}"><div class="caption">MEMORY ${String(i+1).padStart(2,"0")}</div>`;g.appendChild(a)});if(!d.photos.length)s.textContent="🥲 這本相簿目前沒有找到可顯示的照片。"}catch{s.textContent="⏳ 時光機暫時卡住了，請稍後再試。"}})();</script></body></html>
