<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青春時光機｜年份測試</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff8f0,#eef6ff);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:620px;background:#fff;border-radius:24px;padding:34px 24px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}
h1{margin:0 0 8px}.sub{color:#666;line-height:1.7;margin-bottom:22px}
input,select{width:100%;padding:15px;border:2px solid #ddd;border-radius:12px;font-size:16px;margin-top:10px;background:#fff}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.choice input{display:none}.choice span{display:block;padding:13px 4px;border:2px solid #e5e5e5;border-radius:12px;cursor:pointer;line-height:1.7}.choice input:checked+span{background:#222;color:#fff;border-color:#222}
.label{font-weight:bold;margin-top:20px}button{width:100%;padding:16px;margin-top:20px;border:0;border-radius:12px;background:#222;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
#result{margin-top:22px}.box{background:#fafafa;border:1px solid #eee;border-radius:15px;padding:18px;text-align:left}.month{margin:18px 0 8px;font-weight:bold;font-size:18px}.day{display:inline-block;margin:4px;padding:8px 10px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;text-decoration:none}.small{color:#777;font-size:13px;line-height:1.7;margin-top:8px}.fallback{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:9px;background:#222;color:#fff;text-decoration:none}
</style>
</head>
<body><div class="card">
<h1>🕰️ 青春時光機</h1><div class="sub">年份 → 月份 → 真正有保存的日期（測試版）</div>
<input id="username" placeholder="輸入無名帳號" value="">
<div class="label">你想回去哪裡？</div>
<div class="choices">
<label class="choice"><input type="radio" name="type" value="album" checked><span>📷<br>相簿</span></label>
<label class="choice"><input type="radio" name="type" value="blog"><span>📝<br>網誌</span></label>
<label class="choice"><input type="radio" name="type" value="guestbook"><span>💬<br>留言板</span></label>
</div>
<div class="label">選擇年份</div>
<select id="year"></select>
<button id="btn" onclick="searchYear()">🔎 找這一年的紀錄</button>
<div id="result"></div>
</div>
<script>
const ys=document.getElementById("year");for(let y=2013;y>=2003;y--){const o=document.createElement("option");o.value=y;o.textContent=y+" 年";ys.appendChild(o)}
async function searchYear(){
 const username=document.getElementById("username").value.trim(),year=ys.value,type=document.querySelector('input[name="type"]:checked').value,result=document.getElementById("result"),btn=document.getElementById("btn");
 if(!username){alert("請先輸入無名帳號");return}
 result.innerHTML='<div class="box">🔎 正在查 '+year+' 年的保存紀錄…</div>';btn.disabled=true;
 try{
  const r=await fetch(`/api/year?username=${encodeURIComponent(username)}&type=${type}&year=${year}`);
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"查詢失敗");
  if(!d.found){result.innerHTML=`<div class="box">🥲 ${year} 年暫時沒有取得紀錄。<div class="small">這不一定代表當年完全沒有資料。</div><a class="fallback" target="_blank" rel="noopener" href="${d.calendarUrl}">到 Wayback 查看全部日期</a></div>`;return}
  let out=`<div class="box"><strong>🎉 ${year} 年找到 ${d.days.length} 個有保存紀錄的日期</strong>`;
  for(const [month,items] of Object.entries(d.months)){
   out+=`<div class="month">${Number(month)} 月</div>`;
   for(const x of items) out+=`<a class="day" target="_blank" rel="noopener" href="${x.url}">${Number(x.day)} 日</a>`;
  }
  out+=`<div class="small">每一天只顯示一個代表快照；點日期即可進入該次保存。</div></div>`;result.innerHTML=out;
 }catch(e){result.innerHTML=`<div class="box">⚠️ 這次查詢失敗。<div class="small">${e.message}</div></div>`}
 finally{btn.disabled=false}
}
</script></body></html>
